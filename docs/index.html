<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>QuantWatch Cloud Lite</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#0e1b2d; --panel2:#13243a; --line:#233b5a; --text:#e8f0fb; --muted:#8fa5c0; --blue:#60a5fa; --green:#34d399; --red:#fb7185; --amber:#fbbf24; --shadow: 0 16px 36px rgba(0,0,0,.28); }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(1000px 520px at 4% -20%,#14345d 0%,transparent 60%),var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:30px 0 54px; } .top { display:flex; gap:18px; justify-content:space-between; align-items:flex-start; margin-bottom:20px; } h1 { font-size:28px; margin:0; letter-spacing:-.5px; } .sub { margin:6px 0 0; color:var(--muted); } .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; padding-top:8px; } .dot { width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 4px rgba(251,191,36,.12); } .dot.ok { background:var(--green); box-shadow:0 0 0 4px rgba(52,211,153,.12); } .dot.err { background:var(--red); box-shadow:0 0 0 4px rgba(251,113,133,.12); }
    .warning { border:1px solid rgba(251,191,36,.4); color:#fde68a; background:rgba(251,191,36,.07); padding:10px 12px; border-radius:10px; margin-bottom:16px; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; } .stat { background:linear-gradient(145deg,var(--panel),#0a1728); border:1px solid var(--line); border-radius:14px; padding:15px; box-shadow:var(--shadow); } .stat .label { color:var(--muted); font-size:12px; } .stat .number { font-size:25px; font-weight:700; margin-top:4px; } .long { color:var(--green); } .short { color:var(--red); } .neutral { color:var(--amber); }
    .controls { display:flex; gap:10px; flex-wrap:wrap; padding:13px; border:1px solid var(--line); background:rgba(14,27,45,.85); border-radius:14px; margin-bottom:14px; } input,select,button { min-height:38px; border:1px solid var(--line); background:#0b1727; color:var(--text); border-radius:9px; padding:0 11px; font:inherit; } input { flex:1 1 200px; } select { flex:0 1 160px; } button { cursor:pointer; background:#17345b; font-weight:600; } button:hover { background:#214874; } .group { display:flex; gap:6px; } .filter.active { background:#2563eb; border-color:#3b82f6; }
    .table { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow); } table { width:100%; border-collapse:collapse; min-width:850px; } th { text-align:left; color:var(--muted); font-size:12px; font-weight:600; background:#0a1727; padding:12px 14px; white-space:nowrap; } td { padding:13px 14px; border-top:1px solid rgba(35,59,90,.72); white-space:nowrap; } tr:hover td { background:rgba(96,165,250,.045); } .ticker { font-weight:750; letter-spacing:.25px; } .name { color:var(--muted); font-size:12px; margin-top:2px; } .pill { display:inline-flex; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:700; } .pill.long { color:#6ee7b7; background:rgba(52,211,153,.12); } .pill.short { color:#fda4af; background:rgba(251,113,133,.12); } .pill.neutral { color:#fde68a; background:rgba(251,191,36,.12); } .pos { color:var(--green); } .neg { color:var(--red); } .muted { color:var(--muted); } .footer { color:var(--muted); font-size:12px; margin:14px 2px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    @media (max-width:720px) { .wrap { width:min(100% - 22px,1180px); padding-top:18px; } .top { display:block; } .stats { grid-template-columns:repeat(2,1fr); } h1 { font-size:24px; } .status { padding-top:12px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div><h1>QuantWatch <span class="muted">Cloud Lite</span></h1><p class="sub">基于 Cloudflare Worker 的免费档量化信号看板</p></div><div class="status"><i id="dot" class="dot"></i><span id="status">正在连接云端服务…</span></div></header>
    <section id="notice" class="warning" hidden></section>
    <section class="stats"><div class="stat"><div class="label">覆盖标的</div><div id="total" class="number">—</div></div><div class="stat"><div class="label">偏多</div><div id="long" class="number long">—</div></div><div class="stat"><div class="label">中性</div><div id="neutral" class="number neutral">—</div></div><div class="stat"><div class="label">偏空</div><div id="short" class="number short">—</div></div></section>
    <section class="controls"><input id="search" aria-label="搜索代码或名称" placeholder="搜索代码或名称" /><div class="group"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="long">偏多</button><button class="filter" data-filter="neutral">中性</button><button class="filter" data-filter="short">偏空</button></div><select id="sort" aria-label="排序"><option value="consensus">按共识强度</option><option value="changePct">按涨跌幅</option><option value="ticker">按代码</option></select><button id="refresh">刷新</button></section>
    <section class="table"><table><thead><tr><th>标的</th><th>策略共识</th><th>价格</th><th>涨跌</th><th>ATR</th><th>止损 / 止盈</th><th>更新时间</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">正在加载快照…</td></tr></tbody></table></section>
    <footer class="footer"><span id="meta">—</span><span>仅供研究与教育用途，不构成投资建议。</span></footer>
  </main>
<script>
  const API_BASE = window.QUANTWATCH_API || 'https://quantwatch-api.2333333434.workers.dev';
  const state = { items: [], filter: 'all', sort: 'consensus', query: '' };
  const $ = id => document.getElementById(id);
  const fmt = (n, d=2) => Number.isFinite(Number(n)) ? Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
  const percent = n => `${Number(n) >= 0 ? '+' : ''}${fmt(Number(n),2)}%`;
  const cls = n => Number(n) >= 0 ? 'pos' : 'neg';
  const signalName = s => s === 'long' ? '偏多' : s === 'short' ? '偏空' : '中性';
  const escapeHtml = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function render() {
    const q = state.query.toLowerCase();
    let rows = state.items.filter(x => (state.filter === 'all' || x.signal === state.filter) && `${x.ticker} ${x.name}`.toLowerCase().includes(q));
    rows.sort((a,b) => state.sort === 'ticker' ? a.ticker.localeCompare(b.ticker) : state.sort === 'changePct' ? Number(b.changePct)-Number(a.changePct) : Math.abs(Number(b.consensus))-Math.abs(Number(a.consensus)));
    $('rows').innerHTML = rows.length ? rows.map(x => `<tr><td><div class="ticker">${escapeHtml(x.ticker)}</div><div class="name">${escapeHtml(x.name)}</div></td><td><span class="pill ${x.signal}">${signalName(x.signal)} · ${fmt(Math.abs(Number(x.consensus))*100,0)}%</span></td><td>${fmt(x.price)}</td><td class="${cls(x.changePct)}">${percent(x.changePct)}</td><td>${fmt(x.atr)}</td><td>${fmt(x.stopLoss)} <span class="muted">/</span> ${fmt(x.takeProfit)}</td><td class="muted">${new Date(x.updatedAt).toLocaleString('zh-CN',{hour12:false})}</td></tr>`).join('') : '<tr><td colspan="7" class="muted">未找到符合条件的标的。</td></tr>';
  }
  function updateStats() { const c = s => state.items.filter(x=>x.signal===s).length; $('total').textContent=state.items.length; $('long').textContent=c('long'); $('neutral').textContent=c('neutral'); $('short').textContent=c('short'); }
  async function load() {
    $('status').textContent = '正在刷新快照…'; $('dot').className = 'dot';
    try {
      const res = await fetch(`${API_BASE}/api/snapshot`, { cache: 'no-store' }); if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const snap = await res.json(); state.items = Array.isArray(snap.items) ? snap.items : []; updateStats(); render();
      $('dot').className = 'dot ok'; $('status').textContent = `服务正常 · ${snap.source || 'cloud'}`;
      $('meta').textContent = `${snap.universe || 'Cloud Lite'} · 快照生成于 ${new Date(snap.generatedAt).toLocaleString('zh-CN',{hour12:false})}`;
      if (snap.source === 'cloud-seed') { $('notice').hidden=false; $('notice').textContent=snap.disclaimer || '当前展示为云端初始化快照，接入正式行情同步后会自动替换。'; } else $('notice').hidden=true;
    } catch (err) { $('dot').className = 'dot err'; $('status').textContent = '服务连接异常'; $('notice').hidden=false; $('notice').textContent = `无法读取云端快照：${err.message}。请稍后刷新。`; $('rows').innerHTML='<tr><td colspan="7" class="muted">暂时无法载入数据。</td></tr>'; }
  }
  document.querySelectorAll('.filter').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active')); b.classList.add('active'); state.filter=b.dataset.filter; render(); }));
  $('search').addEventListener('input', e => { state.query=e.target.value; render(); }); $('sort').addEventListener('change', e => { state.sort=e.target.value; render(); }); $('refresh').addEventListener('click', load);
  load(); setInterval(load, 300000);
</script>
</body>
</html>
